openapi: 3.0.3
info:
  title: Demo User API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /users:
    get:
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: role
          in: query
          schema: { type: string, enum: [admin, editor, viewer] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404':
          description: Not Found
components:
  schemas:
    NewUser:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, example: Alice }
        email: { type: string, format: email, example: alice@example.com }
        role:
          type: string
          description: 使用者角色（必填，固定選項）
          enum: [admin, editor, viewer]
        status:
          type: string
          description: 帳號狀態（選填，固定選項）
          enum: [active, suspended, pending]
          default: pending
        level:
          type: integer
          description: 會員等級（選填，固定數字選項）
          enum: [1, 2, 3]
        phone: { type: string, description: 電話（選填）, example: '0912345678' }
    User:
      allOf:
        - $ref: '#/components/schemas/NewUser'
        - type: object
          properties:
            id: { type: integer, example: 1 }
